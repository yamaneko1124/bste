name: build-dylib
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          chmod +x build.sh run.sh
          ./build.sh

      - name: Verify
        run: |
          file bsdodge.dylib
          lipo -info bsdodge.dylib
          otool -L bsdodge.dylib
          shasum -a 256 bsdodge.dylib

      - uses: actions/upload-artifact@v4
        with:
          name: bsdodge-dylib
          path: bsdodge.dylib
          if-no-files-found: error
